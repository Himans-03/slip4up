<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slip4Up</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --text:#171a2b; --muted:#6b7089;
  --line:#e3e5f0; --brand:#4f46e5; --brand2:#7c3aed; --ok:#16a34a; --err:#dc2626;
  --shadow:0 1px 2px rgba(20,24,60,.06),0 8px 24px rgba(20,24,60,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1020; --card:#171a30; --text:#eef0ff; --muted:#9aa0c3;
    --line:#2a2e4d; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin:6px 0 20px}
.logo{
  width:44px;height:44px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:9px;
}
.logo i{background:#fff;border-radius:3px;opacity:.95}
h1{font-size:22px;margin:0;letter-spacing:-.2px}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}

.drop{
  display:block;border:2px dashed var(--line);border-radius:16px;
  padding:26px 16px;text-align:center;cursor:pointer;transition:.15s;
}
.drop:hover,.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,transparent)}
.drop .ic{font-size:30px;line-height:1}
.drop b{display:block;margin-top:8px;font-size:16px}
.drop span{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.drop input{display:none}

.row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.row-head h2{font-size:14px;margin:0;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.link{background:none;border:0;color:var(--brand);font-size:13px;font-weight:600;cursor:pointer;padding:4px}

.files{list-style:none;margin:0;padding:0}
.files li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.files li:first-child{border-top:0}
.badge{
  width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));
}
.badge.img{background:linear-gradient(135deg,#0ea5e9,#2563eb)}
.meta{min-width:0;flex:1}
.meta .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:12px;color:var(--muted)}
.x{
  width:32px;height:32px;border-radius:50%;border:0;background:var(--bg);color:var(--muted);
  font-size:18px;cursor:pointer;flex:none;
}
.x:active{background:var(--line)}

.summary{display:flex;gap:14px;align-items:center}
.sheet{
  width:64px;height:90px;flex:none;border:2px solid var(--line);border-radius:6px;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:3px;background:var(--bg);
}
.sheet div{border-radius:3px;background:var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted);font-weight:700}
.sheet div.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.stats{flex:1}
.stats .big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.stats .big small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.stats .sub{font-size:13px;color:var(--muted);margin-top:2px}

.opt{display:flex;justify-content:space-between;align-items:center;gap:12px}
.opt b{font-size:15px}
.opt span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:.2s}
.switch i::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + i{background:var(--brand)}
.switch input:checked + i::after{transform:translateX(20px)}

.btns{display:flex;gap:10px}
.btn{
  flex:1;border:0;border-radius:16px;padding:16px 10px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 20px rgba(79,70,229,.35)}
.btn.ghost{color:var(--brand);background:var(--card);border:2px solid var(--brand)}

.msg{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
.msg.show{display:block}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.msg.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.msg.busy{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)}

.tip{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}

/* Preview viewer */
.viewer{
  position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
.viewer.open{display:flex}
.vbar{
  display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);
  box-shadow:0 1px 0 var(--line);
}
.vbar .t{flex:1;min-width:0}
.vbar .t b{display:block;font-size:15px}
.vbar .t span{font-size:12px;color:var(--muted)}
.vbtn{border:0;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
.vbtn.close{background:var(--bg);color:var(--text)}
.vbtn.dl{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2))}
.vbody{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
.pg{max-width:520px;margin:0 auto 6px}
.pg .lab{font-size:12px;color:var(--muted);margin:6px 2px}
.pg canvas{
  display:block;width:100%;height:auto;background:#fff;border-radius:6px;
  box-shadow:0 2px 12px rgba(0,0,0,.18);
}
.vload{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo"><i></i><i></i><i></i><i></i></div>
    <div>
      <h1>Slip4Up</h1>
      <p>4 labels per A4 sheet. Works offline.</p>
    </div>
  </header>

  <div class="card">
    <label class="drop" id="drop">
      <div class="ic">📄</div>
      <b>Add labels</b>
      <span>Tap to choose PDF, PNG or JPG. You can add more later.</span>
      <input type="file" id="files" multiple accept="application/pdf,image/png,image/jpeg">
    </label>
  </div>

  <div class="card" id="listCard" style="display:none">
    <div class="row-head">
      <h2>Your files</h2>
      <button class="link" id="clear">Clear all</button>
    </div>
    <ul class="files" id="list"></ul>
  </div>

  <div class="card">
    <div class="summary">
      <div class="sheet" id="sheet">
        <div>1</div><div>2</div><div>3</div><div>4</div>
      </div>
      <div class="stats">
        <div class="big"><span id="nSlips">0</span><small>labels</small></div>
        <div class="sub"><span id="nSheets">0</span> A4 sheet(s) · last sheet <span id="fill">0</span>/4 full</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="opt">
      <div>
        <b>Cut lines</b>
        <span>Thin grey guide lines between the quarters</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="lines"><i></i>
      </label>
    </div>
  </div>

  <div class="btns">
    <button class="btn ghost" id="preview" disabled>👁 Preview</button>
    <button class="btn primary" id="go" disabled>Make A4 sheets</button>
  </div>
  <div class="msg" id="msg"></div>

  <p class="tip">
    Print the PDF on A4 at <b>Actual size / 100%</b>.<br>
    Your files never leave this device.
  </p>
</div>

<!-- Preview viewer -->
<div class="viewer" id="viewer">
  <div class="vbar">
    <button class="vbtn close" id="vclose">← Back</button>
    <div class="t"><b>Preview</b><span id="vinfo"></span></div>
    <button class="vbtn dl" id="vdl">Download PDF</button>
  </div>
  <div class="vbody" id="vbody"></div>
</div>

<script>
const { PDFDocument, rgb } = PDFLib;
const $ = id => document.getElementById(id);
let items = [];
let lastBytes = null;
let lastCount = 0;

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

function say(text, kind){
  const m = $('msg');
  m.className = 'msg show ' + kind;
  m.textContent = text;
}
function hideMsg(){ $('msg').className = 'msg'; }

async function addFiles(fileList){
  hideMsg();
  for (const f of fileList){
    const isPdf = f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf');
    let count = 1;
    if (isPdf){
      try{
        const d = await PDFDocument.load(await f.arrayBuffer(), { ignoreEncryption: true });
        count = d.getPageCount();
      }catch(e){
        say('Could not read "' + f.name + '". Skipped.', 'err');
        continue;
      }
    }
    items.push({ file: f, count, isPdf });
  }
  render();
}

function render(){
  const list = $('list');
  list.innerHTML = '';
  items.forEach((it, i) => {
    const li = document.createElement('li');

    const b = document.createElement('div');
    b.className = 'badge' + (it.isPdf ? '' : ' img');
    b.textContent = it.isPdf ? 'PDF' : 'IMG';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const n = document.createElement('div');
    n.className = 'n'; n.textContent = it.file.name;
    const s = document.createElement('div');
    s.className = 's';
    s.textContent = it.count + (it.count === 1 ? ' label' : ' labels');
    meta.append(n, s);

    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove');
    x.onclick = () => { items.splice(i, 1); hideMsg(); render(); };

    li.append(b, meta, x);
    list.append(li);
  });

  const total = items.reduce((a, b) => a + b.count, 0);
  const sheets = Math.ceil(total / 4);
  const fill = total === 0 ? 0 : (total % 4 === 0 ? 4 : total % 4);

  $('listCard').style.display = items.length ? 'block' : 'none';
  $('nSlips').textContent = total;
  $('nSheets').textContent = sheets;
  $('fill').textContent = fill;
  [...$('sheet').children].forEach((c, k) => c.classList.toggle('on', k < fill));
  $('go').disabled = total === 0;
  $('preview').disabled = total === 0;
}

$('files').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
$('clear').onclick = () => { items = []; hideMsg(); render(); };

const drop = $('drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));

/* Build the A4 PDF. Returns { bytes, count } */
async function buildPdf(){
  const out = await PDFDocument.create();
  const W = 595.28, H = 841.89;            // A4 in points
  const cw = W / 2, ch = H / 2, margin = 3;
  const slips = [];

  for (const it of items){
    const buf = await it.file.arrayBuffer();
    if (it.isPdf){
      const src = await PDFDocument.load(buf, { ignoreEncryption: true });
      const pages = await out.embedPdf(src, src.getPageIndices());
      pages.forEach(p => slips.push({ e: p, w: p.width, h: p.height, img: false }));
    }else{
      const isPng = it.file.type === 'image/png' || it.file.name.toLowerCase().endsWith('.png');
      const img = isPng ? await out.embedPng(buf) : await out.embedJpg(buf);
      slips.push({ e: img, w: img.width, h: img.height, img: true });
    }
  }

  const showLines = $('lines').checked;
  let page;
  slips.forEach((it, i) => {
    if (i % 4 === 0){
      page = out.addPage([W, H]);
      if (showLines){
        const c = rgb(0.75, 0.75, 0.75);
        page.drawLine({ start:{x:cw,y:0}, end:{x:cw,y:H}, thickness:0.5, color:c });
        page.drawLine({ start:{x:0,y:ch}, end:{x:W,y:ch}, thickness:0.5, color:c });
      }
    }
    const col = i % 2, row = Math.floor((i % 4) / 2);
    const s = Math.min((cw - 2*margin) / it.w, (ch - 2*margin) / it.h);
    const w = it.w * s, h = it.h * s;
    const x = col * cw + (cw - w) / 2;
    const y = H - (row + 1) * ch + (ch - h) / 2;
    if (it.img) page.drawImage(it.e, { x, y, width: w, height: h });
    else page.drawPage(it.e, { x, y, width: w, height: h });
  });

  return { bytes: await out.save(), count: slips.length };
}

function downloadBytes(bytes){
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'packing-slips-4up.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* Make button */
$('go').onclick = async () => {
  if (!items.length) return;
  $('go').disabled = true; $('preview').disabled = true;
  say('Working…', 'busy');
  try{
    const r = await buildPdf();
    lastBytes = r.bytes; lastCount = r.count;
    downloadBytes(r.bytes);
    say('✓ Done. ' + r.count + ' label(s) on ' + Math.ceil(r.count / 4) + ' A4 sheet(s). Check your Downloads.', 'ok');
  }catch(e){
    say('Error: ' + e.message, 'err');
  }
  render();
};

/* Preview button */
$('preview').onclick = async () => {
  if (!items.length) return;
  $('go').disabled = true; $('preview').disabled = true;
  say('Building preview…', 'busy');
  try{
    const r = await buildPdf();
    lastBytes = r.bytes; lastCount = r.count;
    hideMsg();
    await showPreview(r.bytes, r.count);
  }catch(e){
    say('Error: ' + e.message, 'err');
  }
  render();
};

async function showPreview(bytes, count){
  const body = $('vbody');
  body.innerHTML = '<div class="vload">Loading preview…</div>';
  $('vinfo').textContent = count + ' label(s) · ' + Math.ceil(count / 4) + ' A4 sheet(s)';
  $('viewer').classList.add('open');
  document.body.style.overflow = 'hidden';

  if (!window.pdfjsLib){
    body.innerHTML = '<div class="vload">Preview needs its viewer library. Open the app once while online, then try again. You can still download the PDF.</div>';
    return;
  }

  try{
    const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    body.innerHTML = '';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssWidth = Math.min(body.clientWidth - 28, 520);
    for (let n = 1; n <= doc.numPages; n++){
      const pdfPage = await doc.getPage(n);
      const base = pdfPage.getViewport({ scale: 1 });
      const scale = (cssWidth * dpr) / base.width;
      const vp = pdfPage.getViewport({ scale });
      const wrap = document.createElement('div');
      wrap.className = 'pg';
      const lab = document.createElement('div');
      lab.className = 'lab';
      lab.textContent = 'Sheet ' + n + ' of ' + doc.numPages;
      const cv = document.createElement('canvas');
      cv.width = Math.floor(vp.width);
      cv.height = Math.floor(vp.height);
      wrap.append(lab, cv);
      body.append(wrap);
      await pdfPage.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    }
  }catch(e){
    body.innerHTML = '<div class="vload">Could not show the preview (' + e.message + '). You can still download the PDF.</div>';
  }
}

function closePreview(){
  $('viewer').classList.remove('open');
  $('vbody').innerHTML = '';
  document.body.style.overflow = '';
}
$('vclose').onclick = closePreview;
$('vdl').onclick = () => { if (lastBytes) downloadBytes(lastBytes); };

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
